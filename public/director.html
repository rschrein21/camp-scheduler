<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Director View — Nike Soccer Camp</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f0f2; color: #222; }
  header { background: #111; color: #fff; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; }
  header h1 { font-size: 1rem; font-weight: 700; }
  .header-right { display: flex; align-items: center; gap: 10px; }
  .director-name { font-size: 0.82rem; color: #aaa; }
  .logout-btn { background: #333; color: #fff; border: none; padding: 6px 13px; border-radius: 5px; cursor: pointer; font-size: 0.82rem; }

  /* Login */
  #loginScreen { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .login-card { background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); width: 300px; }
  .login-card h2 { margin-bottom: 6px; font-size: 1.1rem; }
  .login-card p { font-size: 0.8rem; color: #888; margin-bottom: 18px; }
  .login-card label { font-size: 0.78rem; color: #666; font-weight: 600; display: block; margin-bottom: 4px; }
  .login-card input { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 0.95rem; margin-bottom: 12px; }
  .login-btn { width: 100%; background: #111; color: #fff; border: none; padding: 12px; border-radius: 6px; font-size: 1rem; font-weight: 700; cursor: pointer; }
  .error-msg { color: #cc0000; font-size: 0.83rem; margin-top: 8px; display: none; }

  /* Dashboard */
  #dashboard { display: none; }
  .tabs { background: #fff; border-bottom: 1px solid #ddd; display: flex; padding: 0 20px; position: sticky; top: 0; z-index: 10; }
  .tab { padding: 13px 18px; cursor: pointer; font-size: 0.88rem; font-weight: 600; color: #999; border-bottom: 3px solid transparent; }
  .tab.active { color: #0066cc; border-color: #0066cc; }
  .content { max-width: 1000px; margin: 0 auto; padding: 20px 14px 60px; }

  /* Camp cards */
  .camp-section { background: #fff; border-radius: 10px; margin-bottom: 14px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
  .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .camp-hdr { padding: 12px 16px; background: #f8f8f8; border-bottom: 1px solid #eee; display: flex; align-items: center; justify-content: space-between; }
  .camp-hdr h3 { font-size: 0.92rem; font-weight: 700; }
  .staff-count { font-size: 0.8rem; color: #888; font-weight: 600; }

  table.sched { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
  table.sched th { background: #f8f8f8; padding: 7px 10px; text-align: left; font-size: 0.73rem; color: #888; font-weight: 600; border-bottom: 1px solid #eee; }
  table.sched th.center { text-align: center; }
  table.sched td { padding: 9px 10px; border-bottom: 1px solid #f5f5f5; vertical-align: middle; }
  table.sched td.center { text-align: center; }
  table.sched tr:last-child td { border-bottom: none; }
  table.sched tr:hover td { background: #fafafa; }

  .day-badge { display: inline-block; font-size: 0.72rem; font-weight: 700; padding: 3px 7px; border-radius: 10px; }
  .db-full { background: #dbeafe; color: #1d4ed8; }
  .db-am   { background: #fef3c7; color: #92400e; }
  .db-pm   { background: #ede9fe; color: #5b21b6; }
  .db-none { color: #ddd; font-size: 0.7rem; }

  .role-badge { display:inline-block; background:#111; color:#fff; border-radius:8px; padding:2px 7px; font-size:0.72rem; font-weight:700; }
  .contact-link { color: #0066cc; text-decoration: none; font-size: 0.78rem; }
  .contact-link:hover { text-decoration: underline; }

  .week-divider { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
    color: #aaa; padding: 14px 0 6px; }

  .empty { text-align: center; color: #bbb; padding: 24px; font-size: 0.85rem; }
  .summary-bar { background: #fff; border-radius: 10px; padding: 14px 18px; margin-bottom: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06); display: flex; gap: 20px; flex-wrap: wrap; }
  .summary-item { font-size: 0.82rem; color: #555; }
  .summary-item strong { font-size: 1rem; color: #111; display: block; }

  /* Hours tab */
  .hours-input { width: 80px; padding: 5px 7px; border: 1px solid #ddd; border-radius: 5px; font-size: 0.82rem; text-align: center; }
  .notes-input { width: 150px; padding: 5px 7px; border: 1px solid #ddd; border-radius: 5px; font-size: 0.78rem; resize: none; }
  .save-btn { padding: 5px 12px; background: #0066cc; color: #fff; border: none; border-radius: 5px; font-size: 0.78rem; cursor: pointer; font-weight: 600; }
  .save-btn:hover { background: #0055aa; }
  .save-ok { color: #1a7a3a; font-size: 0.75rem; margin-left: 6px; display: none; }
  .total-row td { background: #f8f8f8; font-weight: 700; border-top: 2px solid #eee !important; }

  /* Ratings tab */
  .star-btn { background: none; border: none; font-size: 1.2rem; cursor: pointer; padding: 0 2px; line-height: 1; color: #f0a500; }
  .star-btn.empty { color: #ddd; }
  .rating-note { font-size: 0.78rem; color: #888; }
  .tab-note { background: #fff8e1; border: 1px solid #ffe082; border-radius: 8px; padding: 10px 14px;
    font-size: 0.82rem; color: #7a6000; margin-bottom: 14px; }
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
    <h2>⚽ Director View</h2>
    <p>Nike Soccer Camp — Staff Schedule</p>
    <label>Your Name</label>
    <input type="text" id="dirName" placeholder="Enter your name" onkeydown="if(event.key==='Enter')login()">
    <label>Password</label>
    <input type="password" id="pw" placeholder="Password" onkeydown="if(event.key==='Enter')login()">
    <button class="login-btn" onclick="login()">Log In</button>
    <div class="error-msg" id="loginErr">Wrong password or name not found</div>
  </div>
</div>

<div id="dashboard">
  <header>
    <h1>⚽ Nike Camp — Director Dashboard</h1>
    <div class="header-right">
      <span class="director-name" id="dirLabel"></span>
      <button class="logout-btn" onclick="logout()">Log Out</button>
    </div>
  </header>
  <div class="tabs">
    <div class="tab active" onclick="switchTab('roster')">Roster</div>
    <div class="tab" onclick="switchTab('hours')">Hours</div>
    <div class="tab" onclick="switchTab('ratings')">Ratings</div>
  </div>
  <div class="content">
    <div id="rosterView"></div>
    <div id="hoursView" style="display:none"></div>
    <div id="ratingsView" style="display:none"></div>
  </div>
</div>

<script>
const DAYS = ['Mon','Tue','Wed','Thu','Fri'];
const CAMP_ORDER = [
  'June 15\u201319 \u00b7 Seattle University',
  'June 22\u201326 \u00b7 Seattle University',
  'June 22\u201326 \u00b7 West Seattle Del Ridge',
  'July 6\u201310 \u00b7 Seattle University',
  'July 6\u201310 \u00b7 Lower Woodland',
  'July 6\u201310 \u00b7 Kirkland',
  'July 13\u201317 \u00b7 Seattle University',
  'July 13\u201317 \u00b7 West Seattle Hiawatha',
  'July 13\u201317 \u00b7 Issaquah',
  'July 20\u201324 \u00b7 Seattle University',
  'July 20\u201324 \u00b7 West Seattle Del Ridge',
  'July 20\u201324 \u00b7 Bothell',
  'Aug 3\u20137 \u00b7 Washington Park',
  'Aug 3\u20137 \u00b7 Bellevue',
  'Aug 10\u201314 \u00b7 Lower Woodland',
  'Aug 10\u201314 \u00b7 Issaquah',
  'Aug 17\u201321 \u00b7 West Seattle Del Ridge',
  'Aug 17\u201321 \u00b7 Bellevue',
];

let scheduleData = [];
let hoursData = {};    // keyed by staff_id+camp
let ratingsData = {};  // keyed by staff_id+camp
let currentTab = 'roster';

async function login() {
  const name = document.getElementById('dirName').value.trim();
  const pw = document.getElementById('pw').value;
  const errEl = document.getElementById('loginErr');
  errEl.style.display = 'none';

  const r = await fetch('/api/director/login', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, password: pw })
  });
  const data = await r.json();
  if (r.ok) {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    document.getElementById('dirLabel').textContent = data.director?.name || name;
    load();
  } else {
    errEl.textContent = data.error || 'Login failed';
    errEl.style.display = 'block';
  }
}

async function logout() { await fetch('/api/director/logout', { method: 'POST' }); location.reload(); }

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', (['roster','hours','ratings'][i]) === tab);
  });
  document.getElementById('rosterView').style.display = tab === 'roster' ? '' : 'none';
  document.getElementById('hoursView').style.display = tab === 'hours' ? '' : 'none';
  document.getElementById('ratingsView').style.display = tab === 'ratings' ? '' : 'none';
}

async function load() {
  const [sr, hr, rr] = await Promise.all([
    fetch('/api/director/schedule'),
    fetch('/api/director/hours'),
    fetch('/api/director/ratings'),
  ]);
  scheduleData = sr.ok ? await sr.json() : [];
  const hoursArr = hr.ok ? await hr.json() : [];
  const ratingsArr = rr.ok ? await rr.json() : [];

  // Index hours and ratings for quick lookup
  hoursData = {};
  hoursArr.forEach(h => { hoursData[`${h.staff_id}__${h.camp}`] = h; });
  ratingsData = {};
  ratingsArr.forEach(r => { ratingsData[`${r.staff_id}__${r.camp}`] = r; });

  renderRoster();
  renderHours();
  renderRatings();
}

function weekOf(campName) { return campName.split('·')[0].trim(); }

// Build camp→staff map from schedule data
function buildCampMap() {
  const campMap = {};
  scheduleData.forEach(row => {
    if (!campMap[row.camp]) campMap[row.camp] = {};
    const k = row.staff_id;
    if (!campMap[row.camp][k]) campMap[row.camp][k] = {
      staff_id: row.staff_id, name: row.name, email: row.email, phone: row.phone,
      preferred_role: row.preferred_role, shirt_size: row.shirt_size, shorts_size: row.shorts_size,
      days: {}
    };
    campMap[row.camp][k].days[row.day] = row.confirmed_shift || row.shift;
  });
  return campMap;
}

function orderedCamps(campMap) {
  const camps = CAMP_ORDER.filter(c => campMap[c]);
  Object.keys(campMap).forEach(c => { if (!CAMP_ORDER.includes(c)) camps.push(c); });
  return camps;
}

function renderRoster() {
  const campMap = buildCampMap();
  const camps = orderedCamps(campMap);

  if (!camps.length) {
    document.getElementById('rosterView').innerHTML = '<div class="empty">No confirmed staff for your assigned camps yet.</div>';
    return;
  }

  let html = '';
  let lastWeek = null;
  camps.forEach(campName => {
    const week = weekOf(campName);
    if (week !== lastWeek) { html += `<div class="week-divider">${week}</div>`; lastWeek = week; }

    const staffArr = Object.values(campMap[campName]).sort((a, b) => a.name.localeCompare(b.name));
    html += `<div class="camp-section">
      <div class="camp-hdr">
        <h3>${campName}</h3>
        <span class="staff-count">${staffArr.length} staff confirmed</span>
      </div>
      <div class="table-scroll"><table class="sched">
        <thead><tr>
          <th>Name</th>
          <th>Email</th>
          <th>Phone</th>
          <th>Age Pref</th>
          <th class="center">Shirt</th>
          <th class="center">Shorts</th>
          ${DAYS.map(d => `<th class="center">${d}</th>`).join('')}
        </tr></thead>
        <tbody>`;

    staffArr.forEach(s => {
      html += `<tr>
        <td><strong>${s.name}</strong></td>
        <td><a class="contact-link" href="mailto:${s.email}">${s.email}</a></td>
        <td>${s.phone ? `<a class="contact-link" href="tel:${s.phone}">${s.phone}</a>` : '<span style="color:#ccc;font-size:0.75rem">—</span>'}</td>
        <td><span class="role-badge">${s.preferred_role || '?'}</span></td>
        <td class="center">${s.shirt_size || '<span style="color:#ccc">—</span>'}</td>
        <td class="center">${s.shorts_size || '<span style="color:#ccc">—</span>'}</td>
        ${DAYS.map(d => {
          const shift = s.days[d];
          if (!shift) return `<td class="center"><span class="day-badge db-none">—</span></td>`;
          const cls = shift === 'full' ? 'db-full' : shift === 'am' ? 'db-am' : 'db-pm';
          const mon = d === 'Mon';
          const label = shift === 'full' ? (mon ? 'Full Day (7:50am–3:20pm)' : 'Full Day (8:20am–3:20pm)') : shift === 'am' ? (mon ? 'AM (7:50am–12pm)' : 'AM (8am–12pm)') : shift === 'pm' ? 'PM (12pm–4pm)' : shift.toUpperCase();
          return `<td class="center"><span class="day-badge ${cls}">${label}</span></td>`;
        }).join('')}
      </tr>`;
    });

    html += `</tbody></table></div></div>`;
  });

  document.getElementById('rosterView').innerHTML = html;
}

function renderHours() {
  const campMap = buildCampMap();
  const camps = orderedCamps(campMap);

  if (!camps.length) {
    document.getElementById('hoursView').innerHTML = '<div class="empty">No confirmed staff for your assigned camps yet.</div>';
    return;
  }

  let html = '';
  let lastWeek = null;
  camps.forEach(campName => {
    const week = weekOf(campName);
    if (week !== lastWeek) { html += `<div class="week-divider">${week}</div>`; lastWeek = week; }

    const staffArr = Object.values(campMap[campName]).sort((a, b) => a.name.localeCompare(b.name));
    const campKey = campName.replace(/'/g, "\\'");

    html += `<div class="camp-section">
      <div class="camp-hdr">
        <h3>${campName}</h3>
        <span class="staff-count">${staffArr.length} staff</span>
      </div>
      <div class="table-scroll"><table class="sched">
        <thead><tr>
          <th>Name</th>
          <th>Phone</th>
          <th>Email</th>
          <th class="center">Hours</th>
          <th>Notes</th>
          <th class="center">Save</th>
        </tr></thead>
        <tbody>`;

    let totalHours = 0;
    staffArr.forEach(s => {
      const key = `${s.staff_id}__${campName}`;
      const existing = hoursData[key] || {};
      const hrs = existing.hours != null ? existing.hours : '';
      const notes = existing.notes || '';
      if (existing.hours) totalHours += parseFloat(existing.hours) || 0;
      html += `<tr>
        <td><strong>${s.name}</strong></td>
        <td>${s.phone ? `<a class="contact-link" href="tel:${s.phone}">${s.phone}</a>` : '<span style="color:#ccc">—</span>'}</td>
        <td><a class="contact-link" href="mailto:${s.email}">${s.email}</a></td>
        <td class="center">
          <input type="number" class="hours-input" id="hrs-${s.staff_id}-${campName.replace(/[^a-z0-9]/gi,'_')}"
            value="${hrs}" step="0.5" min="0" placeholder="0">
        </td>
        <td>
          <input type="text" class="notes-input" id="hnotes-${s.staff_id}-${campName.replace(/[^a-z0-9]/gi,'_')}"
            value="${notes.replace(/"/g,'&quot;')}" placeholder="Optional notes">
        </td>
        <td class="center">
          <button class="save-btn" onclick="saveHours(${s.staff_id}, '${campKey}', '${campName.replace(/[^a-z0-9]/gi,'_')}')">Save</button>
          <span class="save-ok" id="oks-${s.staff_id}-${campName.replace(/[^a-z0-9]/gi,'_')}">✓</span>
        </td>
      </tr>`;
    });

    html += `<tr class="total-row">
      <td colspan="3"><strong>Total Hours</strong></td>
      <td class="center" id="total-${campName.replace(/[^a-z0-9]/gi,'_')}"><strong>${totalHours.toFixed(1)}</strong></td>
      <td colspan="2"></td>
    </tr>`;
    html += `</tbody></table></div></div>`;
  });

  document.getElementById('hoursView').innerHTML = html;
}

async function saveHours(staffId, camp, campSlug) {
  const hrsEl = document.getElementById(`hrs-${staffId}-${campSlug}`);
  const notesEl = document.getElementById(`hnotes-${staffId}-${campSlug}`);
  const okEl = document.getElementById(`oks-${staffId}-${campSlug}`);
  const hours = parseFloat(hrsEl.value) || 0;
  const notes = notesEl ? notesEl.value : '';

  const r = await fetch('/api/director/hours', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ staff_id: staffId, camp, hours, notes })
  });
  if (r.ok) {
    // Update local cache
    hoursData[`${staffId}__${camp}`] = { staff_id: staffId, camp, hours, notes };
    if (okEl) { okEl.style.display = 'inline'; setTimeout(() => { okEl.style.display = 'none'; }, 2000); }
    // Recalculate total for this camp
    const totalEl = document.getElementById(`total-${campSlug}`);
    if (totalEl) {
      let total = 0;
      Object.entries(hoursData).forEach(([k, v]) => {
        if (k.endsWith(`__${camp}`)) total += parseFloat(v.hours) || 0;
      });
      totalEl.innerHTML = `<strong>${total.toFixed(1)}</strong>`;
    }
  }
}

function renderRatings() {
  const campMap = buildCampMap();
  const camps = orderedCamps(campMap);

  if (!camps.length) {
    document.getElementById('ratingsView').innerHTML = '<div class="empty">No confirmed staff for your assigned camps yet.</div>';
    return;
  }

  let html = '<div class="tab-note">⭐ Rate staff who worked for you this week (1–5 stars)</div>';
  let lastWeek = null;
  camps.forEach(campName => {
    const week = weekOf(campName);
    if (week !== lastWeek) { html += `<div class="week-divider">${week}</div>`; lastWeek = week; }

    const staffArr = Object.values(campMap[campName]).sort((a, b) => a.name.localeCompare(b.name));
    const campKey = campName.replace(/'/g, "\\'");

    html += `<div class="camp-section">
      <div class="camp-hdr">
        <h3>${campName}</h3>
        <span class="staff-count">${staffArr.length} staff</span>
      </div>
      <div class="table-scroll"><table class="sched">
        <thead><tr>
          <th>Name</th>
          <th class="center">Rating</th>
          <th>Notes</th>
          <th class="center">Save</th>
        </tr></thead>
        <tbody>`;

    staffArr.forEach(s => {
      const key = `${s.staff_id}__${campName}`;
      const existing = ratingsData[key] || {};
      const curRating = existing.rating || 0;
      const notes = existing.notes || '';
      const campSlug = campName.replace(/[^a-z0-9]/gi,'_');
      html += `<tr>
        <td><strong>${s.name}</strong></td>
        <td class="center" id="stars-${s.staff_id}-${campSlug}">
          ${[1,2,3,4,5].map(i =>
            `<button class="star-btn ${i <= curRating ? '' : 'empty'}"
              onclick="setRating(${s.staff_id}, '${campKey}', '${campSlug}', ${i})">${i <= curRating ? '★' : '☆'}</button>`
          ).join('')}
        </td>
        <td>
          <input type="text" class="notes-input" id="rnotes-${s.staff_id}-${campSlug}"
            value="${notes.replace(/"/g,'&quot;')}" placeholder="Notes...">
        </td>
        <td class="center">
          <button class="save-btn" onclick="saveRating(${s.staff_id}, '${campKey}', '${campSlug}')">Save</button>
          <span class="save-ok" id="rok-${s.staff_id}-${campSlug}">✓</span>
        </td>
      </tr>`;
    });

    html += `</tbody></table></div></div>`;
  });

  document.getElementById('ratingsView').innerHTML = html;
}

function setRating(staffId, camp, campSlug, rating) {
  // Update UI stars
  const starsEl = document.getElementById(`stars-${staffId}-${campSlug}`);
  if (starsEl) {
    starsEl.innerHTML = [1,2,3,4,5].map(i =>
      `<button class="star-btn ${i <= rating ? '' : 'empty'}"
        onclick="setRating(${staffId}, '${camp.replace(/'/g,"\\'")}', '${campSlug}', ${i})">${i <= rating ? '★' : '☆'}</button>`
    ).join('');
  }
  // Store pending rating in a temp place
  const key = `${staffId}__${camp}`;
  if (!ratingsData[key]) ratingsData[key] = {};
  ratingsData[key].rating = rating;
}

async function saveRating(staffId, camp, campSlug) {
  const key = `${staffId}__${camp}`;
  const rating = ratingsData[key]?.rating || 3;
  const notesEl = document.getElementById(`rnotes-${staffId}-${campSlug}`);
  const notes = notesEl ? notesEl.value : '';
  const okEl = document.getElementById(`rok-${staffId}-${campSlug}`);

  const r = await fetch('/api/director/rate', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ staff_id: staffId, camp, rating, notes })
  });
  if (r.ok) {
    ratingsData[key] = { staff_id: staffId, camp, rating, notes };
    if (okEl) { okEl.style.display = 'inline'; setTimeout(() => { okEl.style.display = 'none'; }, 2000); }
  }
}
</script>
</body>
</html>
