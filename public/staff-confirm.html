<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirm Your Schedule — Nike Soccer Camps</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f0f2; color: #222; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .card { background: #fff; border-radius: 14px; box-shadow: 0 2px 16px rgba(0,0,0,0.1); max-width: 480px; width: 100%; padding: 32px 28px; }
  .logo { font-size: 2rem; text-align: center; margin-bottom: 6px; }
  h1 { font-size: 1.2rem; font-weight: 700; text-align: center; margin-bottom: 4px; }
  .subtitle { font-size: 0.85rem; color: #888; text-align: center; margin-bottom: 24px; }
  .camp-badge { background: #111; color: #fff; border-radius: 20px; padding: 6px 16px; font-size: 0.85rem; font-weight: 700; display: inline-block; margin-bottom: 20px; }
  .schedule-table { width: 100%; border-collapse: collapse; margin-bottom: 24px; }
  .schedule-table th { text-align: left; font-size: 0.75rem; font-weight: 600; color: #888; padding: 6px 10px; border-bottom: 1px solid #eee; }
  .schedule-table td { padding: 10px; border-bottom: 1px solid #f5f5f5; font-size: 0.9rem; }
  .schedule-table tr:last-child td { border-bottom: none; }
  .shift-badge { display: inline-block; font-size: 0.75rem; font-weight: 700; padding: 3px 10px; border-radius: 10px; }
  .shift-full { background: #dbeafe; color: #1d4ed8; }
  .shift-am   { background: #fef3c7; color: #92400e; }
  .shift-pm   { background: #ede9fe; color: #5b21b6; }
  .confirm-btn { width: 100%; background: #1a7a3a; color: #fff; border: none; border-radius: 8px; padding: 16px; font-size: 1.05rem; font-weight: 700; cursor: pointer; transition: background 0.15s; }
  .confirm-btn:hover:not(:disabled) { background: #155f2e; }
  .confirm-btn:disabled { opacity: 0.6; cursor: default; }
  .already-confirmed { text-align: center; background: #f0faf4; border: 1px solid #a7d7b5; border-radius: 10px; padding: 20px; }
  .already-confirmed .check { font-size: 2.5rem; margin-bottom: 8px; }
  .already-confirmed p { color: #1a7a3a; font-weight: 700; font-size: 1rem; }
  .already-confirmed small { color: #888; font-size: 0.8rem; }
  .error-state { text-align: center; color: #cc3300; padding: 20px; }
  .loading { text-align: center; color: #888; padding: 40px; font-size: 0.9rem; }
  .hi-name { font-weight: 700; }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="loading">Loading your schedule…</div>
</div>

<script>
const params = new URLSearchParams(location.search);
const token = params.get('token');

async function load() {
  const card = document.getElementById('card');
  if (!token) {
    card.innerHTML = '<div class="error-state">❌ Invalid link. Please check your email for the correct link.</div>';
    return;
  }

  const r = await fetch(`/api/staff-confirm?token=${encodeURIComponent(token)}`);
  if (!r.ok) {
    const e = await r.json().catch(() => ({}));
    card.innerHTML = `<div class="error-state">❌ ${e.error || 'Invalid or expired link'}</div>`;
    return;
  }

  const { name, camp, confirmed, confirmed_at, schedule } = await r.json();

  const DAYS = ['Mon','Tue','Wed','Thu','Fri'];
  const orderedSchedule = [...schedule].sort((a, b) => DAYS.indexOf(a.day) - DAYS.indexOf(b.day));

  const shiftLabel = s => s === 'full' ? 'Full Day' : s === 'am' ? 'AM Only' : 'PM Only';
  const shiftClass = s => s === 'full' ? 'shift-full' : s === 'am' ? 'shift-am' : 'shift-pm';

  const scheduleRows = orderedSchedule.map(d => `
    <tr>
      <td><strong>${d.day}</strong></td>
      <td><span class="shift-badge ${shiftClass(d.shift)}">${shiftLabel(d.shift)}</span></td>
    </tr>
  `).join('');

  if (confirmed) {
    const confirmedDate = confirmed_at ? new Date(confirmed_at).toLocaleDateString('en-US', {month:'long', day:'numeric'}) : '';
    card.innerHTML = `
      <div class="logo">⚽</div>
      <h1>Schedule Already Confirmed</h1>
      <div class="subtitle">Nike Soccer Camps</div>
      <div class="already-confirmed">
        <div class="check">✅</div>
        <p>You're confirmed for ${camp}!</p>
        ${confirmedDate ? `<small>Confirmed on ${confirmedDate}</small>` : ''}
      </div>
      <table class="schedule-table" style="margin-top:20px">
        <thead><tr><th>Day</th><th>Shift</th></tr></thead>
        <tbody>${scheduleRows}</tbody>
      </table>
      <div style="margin-top:18px;text-align:center">
        <a href="/staff-manage?token=${encodeURIComponent(token)}" style="display:inline-block;padding:10px 20px;background:#f5f5f5;color:#555;border-radius:8px;font-size:0.85rem;font-weight:600;text-decoration:none;border:1px solid #ddd">⚙️ Need to cancel a shift?</a>
      </div>
      <p style="font-size:0.8rem;color:#aaa;text-align:center;margin-top:12px">Questions? Reply to the email from Rich or text 206-605-9954.</p>
    `;
    return;
  }

  card.innerHTML = `
    <div class="logo">⚽</div>
    <h1>Confirm Your Schedule</h1>
    <div class="subtitle">Nike Soccer Camps — please review and confirm below</div>
    <p style="margin-bottom:14px">Hi <span class="hi-name">${name}</span>,</p>
    <p style="margin-bottom:16px;font-size:0.9rem;color:#555">Your schedule for the following camp has been set. Please review and click <strong>Confirm</strong> to let us know you'll be there.</p>
    <div style="text-align:center;margin-bottom:18px"><span class="camp-badge">${camp}</span></div>
    <table class="schedule-table">
      <thead><tr><th>Day</th><th>Shift</th></tr></thead>
      <tbody>${scheduleRows}</tbody>
    </table>
    <button class="confirm-btn" id="confirmBtn" onclick="confirm()">✅ Confirm My Schedule</button>
    <div style="margin-top:14px;text-align:center">
      <a href="/staff-manage?token=${encodeURIComponent(token)}" style="display:inline-block;padding:10px 20px;background:#f5f5f5;color:#555;border-radius:8px;font-size:0.85rem;font-weight:600;text-decoration:none;border:1px solid #ddd">⚙️ Need to cancel or change a day?</a>
    </div>
    <p style="font-size:0.8rem;color:#aaa;text-align:center;margin-top:12px">Questions? Reply to the email from Rich or text 206-605-9954.</p>
  `;
}

async function confirm() {
  const btn = document.getElementById('confirmBtn');
  btn.disabled = true;
  btn.textContent = 'Confirming…';

  const r = await fetch('/api/staff-confirm', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ token })
  });

  if (r.ok) {
    const card = document.getElementById('card');
    card.innerHTML = `
      <div class="logo">⚽</div>
      <h1>You're Confirmed!</h1>
      <div class="subtitle">Nike Soccer Camps</div>
      <div class="already-confirmed">
        <div class="check">✅</div>
        <p>Thanks! Rich has been notified.</p>
        <small>See you at camp!</small>
      </div>
    `;
  } else {
    btn.disabled = false;
    btn.textContent = '✅ Confirm My Schedule';
    alert('Something went wrong. Please try again or contact Rich.');
  }
}

load();
</script>
</body>
</html>
